[project]
name = "signtrustmap-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "boto3>=1.34.0",
    "fastapi[standard]>=0.141.1",
    "gpxpy>=1.6.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "lapx>=0.9.4",
    "loguru>=0.7.3",
    "manim>=0.19.1",
    "numpy>=2.2.6",
    "onnx>=1.22.0",
    "onnxslim>=0.1.96",
    "opencv-python>=5.0.0.93",
    "orjson>=3.11.9",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "pydantic-settings>=2.14.2",
    "pyproj>=3.7.1",
    "python-dotenv>=1.2.2",
    "scipy>=1.15.3",
    "tenacity>=9.1.4",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.14.1",
    "ultralytics==8.4.114",
]



[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "jetson"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"

[tool.uv.sources]
torch = [
    { index = "jetson", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
    { index = "pypi", marker = "platform_machine != 'aarch64' or sys_platform != 'linux'" }
]
torchvision = [
    { index = "jetson", marker = "platform_machine == 'aarch64' and sys_platform == 'linux'" },
    { index = "pypi", marker = "platform_machine != 'aarch64' or sys_platform != 'linux'" }
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = [
    "platform_machine == 'aarch64' and sys_platform == 'linux'",
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
required-environments = [
    "platform_machine == 'aarch64' and sys_platform == 'linux'",
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]

