version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: signtrustmap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  service:
    build: .
    container_name: signtrustmap_service
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
